[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rbit"
version = "0.1.0"
description = "Grid-scale battery arbitrage with deep reinforcement learning"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Brian Amadio", email = "5180129+btamadio@users.noreply.github.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "beautifulsoup4==4.15.0",
    "pandas==3.0.6",
    "requests==2.34.2",
    "supabase==2.31.0",
]

[tool.setuptools.packages.find]
where = ["src"]
