[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rbit"
version = "0.1.0"
description = "Grid-scale battery arbitrage with deep reinforcement learning (NEM)"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "duckdb>=1.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "highspy>=1.7",
    "gymnasium>=1.0",
    "scikit-learn>=1.5",
    "stable-baselines3>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["rbit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["realdata: needs ingested data under data/clean (skipped otherwise)"]
